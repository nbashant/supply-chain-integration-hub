[project]
name = "supply-chain-integration-hub"
version = "0.1.0"
description = "A local, production-style supply-chain integration study project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "boto3>=1.40,<2",
    "celery[redis]>=5.6,<6",
    "fastapi>=0.116,<1",
    "numpy>=2.3,<3",
    "pandas>=2.3,<4",
    "polars>=1.31,<2",
    "prometheus-client>=0.22,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "mypy>=1.17,<2",
    "pandas-stubs>=2.3,<3",
    "pytest>=8.4,<10",
    "pytest-cov>=6.2,<8",
    "ruff>=0.12,<1",
    "types-boto3[s3]>=1.40,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supply_chain_hub"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "e2e: requires the complete live Docker Compose application",
    "integration: requires a running PostgreSQL database",
]

[tool.coverage.run]
branch = true
source = ["supply_chain_hub"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "N",
    "RUF",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "kombu", "kombu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "supply_chain_hub.worker.tasks"
disallow_untyped_decorators = false
